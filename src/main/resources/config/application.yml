---
server:
  port: 8085
  undertow:
    # -1 does NOT work (Spring Boot DataSize parsing rejects negative values).
    # Use a large positive value. The gateway is a reverse proxy; backends enforce their own limits.
    max-http-post-size: 100GB

spring:
  http:
    codecs:
      max-in-memory-size: 10MB
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true

ecos:
  webapp:
    properties:
      gatewayMode: true
    x509:
      keys:
        application:
          location: classpath:ecos/x509/keys/application.key
    records:
      defaultApp: alfresco
      sourceIdMapping:
        uiserv/eform: uiserv/form
